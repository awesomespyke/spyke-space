<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thin Film — Twinkle</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
(function(){
var c=document.getElementById('c'),gl=c.getContext('webgl2',{alpha:false,antialias:false}),w,h,b=[],last=0;
if(!gl){document.body.textContent='WebGL 2 is unavailable';document.body.style.color='white';return;}
var N=13,TAU=Math.PI*2;
const vs=`#version 300 es
in vec2 corner; uniform vec2 center, viewport; uniform float radius; out vec2 q;
void main(){q=corner;vec2 pos=center+corner*radius;gl_Position=vec4(pos/viewport*vec2(2.,-2.)+vec2(-1.,1.),0.,1.);}`;
const fs=`#version 300 es
precision highp float; in vec2 q; out vec4 color; uniform float time,phase,hue,radius,opacity; uniform int kind;
vec3 hsl(float h,float s,float l){vec3 k=mod(vec3(0.,8.,4.)+h*12.,12.);return l-s*min(l,1.-l)*clamp(min(k-3.,9.-k),-1.,1.);}
void main(){float r=length(q);float aa=max(fwidth(r),.0001);float mask=1.-smoothstep(1.-aa,1.+aa,r);
if(kind==2){float a=atan(q.y,q.x);float h=fract(hue+(3.*sin(a*2.+time*.24+phase)+2.*cos(a*3.-time*.17))*45./360.+time*5./360.);float halo=exp(-pow((r-1.)/.105,2.))*.20+exp(-pow((r-1.)/.24,2.))*.045;color=vec4(hsl(h,.88,.65),halo);return;}
if(kind==3){float ring=exp(-pow((r-.72)/.055,2.));float haze=exp(-pow((r-.72)/.19,2.));color=vec4(mix(hsl(hue,.85,.65),vec3(1.),.55),opacity*(ring*.8+haze*.22));return;}
if(kind==4){float glow=exp(-r*r*5.);float core=exp(-r*r*45.);color=vec4(mix(hsl(hue,.85,.68),vec3(1.),core),opacity*(glow*.35+core*.85));return;}
if(mask<=0.)discard;
if(kind==1){color=vec4(hsl(hue,.65,.8),opacity*mask);return;}
float a=atan(q.y,q.x);float wave=3.*sin(a*2.+time*.24+phase)+2.*cos(a*3.-time*.17);float h=fract(hue+(wave*45.+time*5.)/360.);float strength=.28+.48*pow(abs(cos(a-.9)),5.);
vec3 rgb=mix(vec3(15.,24.,40.)/255.,vec3(145.,185.,230.)/255.,smoothstep(.72,1.,r));float alpha=mix(.015,.22,smoothstep(.72,1.,r));vec3 prem=rgb*alpha;
for(int k=0;k<3;k++){float f=float(k);float d=abs(r-(.985-f*.038));float band=1.-smoothstep(.019-aa,.019+aa,d);float a2=band*strength*(1.-f*.25);vec3 col=mix(hsl(h,.88,.67+f*.05),vec3(1.),.12);prem=col*a2+prem*(1.-a2);alpha=a2+alpha*(1.-a2);}
vec2 v=q-vec2(-.38,-.57);float cs=cos(-.55),sn=sin(-.55);vec2 e=vec2(cs*v.x+sn*v.y,-sn*v.x+cs*v.y)/vec2(.24,.045);float highlight=(1.-smoothstep(.9,1.1,length(e)))*.48;prem=vec3(.88,.94,1.)*highlight+prem*(1.-highlight);alpha=highlight+alpha*(1.-highlight);color=vec4(prem/max(alpha,.00001),alpha*mask);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1.65,-1.65,1.65,-1.65,-1.65,1.65,1.65,1.65]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,'corner');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};for(const n of ['center','viewport','radius','time','phase','hue','opacity','kind'])U[n]=gl.getUniformLocation(prog,n);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(2/255,3/255,7/255,1);
function render(o,t,kind,opacity){gl.uniform2f(U.center,o.x,o.y);gl.uniform1f(U.radius,o.r);gl.uniform1f(U.time,t);gl.uniform1f(U.phase,o.p||0);gl.uniform1f(U.hue,o.hue/360);gl.uniform1f(U.opacity,opacity);gl.uniform1i(U.kind,kind);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function spawn(initial,t){var o={x:Math.random()*w,y:initial?Math.random()*h:h+20,r:(.035+Math.pow(Math.random(),2)*.15)*Math.min(w,h),v:8+Math.random()*17,vx:0,vy:-12,life:12+Math.random()*65,age:initial?Math.random()*10:0,p:Math.random()*TAU,hue:Math.random()*360};o.announced=initial;return o;}
function resize(){w=innerWidth;h=innerHeight;var scale=Math.min(devicePixelRatio||1,2,3840/Math.max(w,h));c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.viewport,w,h);b=[];drops=[];flashes=[];for(var i=0;i<N;i++)b.push(spawn(true,last/1000));}
var drops=[],flashes=[],audio=null,noise=null,muted=false;
function unlock(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.24),audio.sampleRate);var data=noise.getChannelData(0);for(var i=0;i<data.length;i++)data[i]=Math.random()*2-1;}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
window.addEventListener('pointerdown',unlock);window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='m')muted=!muted;unlock();});unlock();
function birthSound(o){if(muted||!audio||audio.state!=='running')return;var t=audio.currentTime,size=Math.min(1,o.r/Math.min(w,h)/.19),base=190-85*size;var osc=audio.createOscillator(),g=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(base,t);osc.frequency.exponentialRampToValueAtTime(base*2.7,t+.085);osc.frequency.exponentialRampToValueAtTime(base*2.1,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.22);osc.connect(g);g.connect(audio.destination);osc.start(t);osc.stop(t+.24);}
function popSound(o){if(muted||!audio||audio.state!=='running')return;var t=audio.currentTime,size=Math.min(1,o.r/Math.min(w,h)/.19),base=1050-350*size+Math.random()*180;[1,1.5,2].forEach(function(r,i){var start=t+[0,.085,.19][i],dur=[.42,.38,.48][i];[1,2.76].forEach(function(part,j){var osc=audio.createOscillator(),g=audio.createGain();osc.type='sine';osc.frequency.value=base*r*part;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime([.045,.025,.014][i]*(j?.18:1),start+.006);g.gain.exponentialRampToValueAtTime(.0001,start+dur*(j?.55:1));osc.connect(g);g.connect(audio.destination);osc.start(start);osc.stop(start+dur+.02);});});}

function burst(o){popSound(o);flashes.push({x:o.x,y:o.y,r:o.r,hue:o.hue,age:0,life:.38});for(var j=0;j<38;j++){var a=j*TAU/38+Math.random()*.3;var speed=o.r*(.3+Math.random()*.65);drops.push({x:o.x+Math.cos(a)*o.r*.9,y:o.y+Math.sin(a)*o.r*.9,vx:o.vx+Math.cos(a)*speed,vy:o.vy+Math.sin(a)*speed,age:0,life:1.6+Math.random()*1.7,r:Math.max(2,o.r*(.012+Math.random()*.022)),hue:(o.hue+(3*Math.sin(a*2+last/1000*.24+o.p)+2*Math.cos(a*3-last/1000*.17))*45+last/1000*5+720)%360,seed:Math.random()*TAU,trail:[],sample:0});}}
function draw(ms){var t=ms/1000,dt=last?Math.min(.15,(ms-last)/1000):0;last=ms;gl.clear(gl.COLOR_BUFFER_BIT);for(var i=0;i<N;i++){var o=b[i],r=o.r;o.age+=dt;var X=o.x/w,Y=o.y/h;var u=24*Math.sin(Y*7+t*.12)+13*Math.cos(X*5-Y*3-t*.09);var v=-o.v+22*Math.cos(X*7+t*.1)+9*Math.sin(Y*6+X*3-t*.13);var ease=1-Math.exp(-dt*1.4);o.vx+=(u-o.vx)*ease;o.vy+=(v-o.vy)*ease;o.x+=o.vx*dt;o.y+=o.vy*dt;if(!o.announced&&o.y-r<h&&o.y+r>0&&o.x+r>0&&o.x-r<w){o.announced=true;birthSound(o);}if(o.age>=o.life){if(o.y+r>0&&o.y-r<h&&o.x+r>0&&o.x-r<w)burst(o);b[i]=spawn(false,t);continue;}if(o.y+r<0||o.x+r<0||o.x-r>w||o.y-r>h+220){b[i]=spawn(false,t);continue;}gl.blendFunc(gl.SRC_ALPHA,gl.ONE);render(o,t,2,1);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);render(o,t,0,1);}gl.blendFunc(gl.SRC_ALPHA,gl.ONE);for(var k=flashes.length-1;k>=0;k--){var f=flashes[k];f.age+=dt;if(f.age>=f.life){flashes.splice(k,1);continue;}var p=f.age/f.life;render({x:f.x,y:f.y,r:f.r*(1.38+p*.55),hue:f.hue},t,3,.85*Math.pow(1-p,2));}for(var j=drops.length-1;j>=0;j--){var a=drops[j];a.age+=dt;if(a.age>=a.life){drops.splice(j,1);continue;}a.sample+=dt;if(a.sample>=.045){a.sample=0;a.trail.push({x:a.x,y:a.y,age:a.age});if(a.trail.length>7)a.trail.shift();}a.vx*=Math.exp(-dt*1.8);a.vy*=Math.exp(-dt*1.2);a.vy+=35*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;var fade=Math.pow(1-a.age/a.life,1.4);for(var m=0;m<a.trail.length;m++){var q=a.trail[m],tail=Math.max(0,1-(a.age-q.age)/.34);if(tail>0)render({x:q.x,y:q.y,r:a.r*(.35+.55*tail),hue:a.hue},t,4,fade*tail*.35);}render(a,t,4,fade*(.65+.35*Math.sin(t*9+a.seed)**2));}gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);requestAnimationFrame(draw);}
resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
})();
</script></body></html>
