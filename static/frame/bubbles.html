<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thin Film — Computational Study</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
var c=document.getElementById('c'),g=c.getContext('2d'),w,h,b=[];function resize(){w=c.width=innerWidth;h=c.height=innerHeight;}resize();window.addEventListener('resize',resize);function spawn(initial){return {x:Math.random()*w,y:initial?Math.random()*h:h+200,r:(.035+Math.pow(Math.random(),2)*.15)*Math.min(w,h),v:8+Math.random()*17,p:Math.random()*6.28,hue:Math.random()*360};}for(var i=0;i<13;i++)b.push(spawn(true));var last=0;function draw(ms){var t=ms/1000,dt=Math.min(.05,(ms-last)/1000||.016);last=ms;g.fillStyle='#020307';g.fillRect(0,0,w,h);for(var i=0;i<b.length;i++){var o=b[i],r=o.r,x=o.x+Math.sin(t*.23+o.p)*r*.3,y=o.y;o.y-=o.v*dt;if(y+r<0){b[i]=spawn(false);continue;}g.save();g.translate(x,y);g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.clip();var q=g.createRadialGradient(-r*.2,-r*.25,r*.05,0,0,r);q.addColorStop(0,'rgba(15,24,40,0.015)');q.addColorStop(.72,'rgba(30,45,65,0.035)');q.addColorStop(1,'rgba(145,185,230,0.22)');g.fillStyle=q;g.fillRect(-r,-r,r*2,r*2);for(var j=0;j<120;j++){var a=j*Math.PI/60,phase=3*Math.sin(a*2+t*.24+o.p)+2*Math.cos(a*3-t*.17),hu=(o.hue+phase*45+t*5)%360;for(var k=0;k<5;k++){g.beginPath();g.arc(0,0,r*(.985-k*.023),a,a+.061);g.strokeStyle='hsla('+hu+',85%,'+(65+k*3)+'%,'+((.12+.25*Math.pow(Math.abs(Math.cos(a-.9)),5))*(1-k*.17))+')';g.lineWidth=Math.max(.7,r*.026);g.stroke();}}g.beginPath();g.ellipse(-r*.38,-r*.57,r*.24,r*.045,-.55,0,Math.PI*2);g.fillStyle='rgba(225,240,255,.22)';g.fill();g.restore();}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
