<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thin Film — Computational Study</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
(function(){
var c=document.getElementById('c'),g=c.getContext('2d'),w,h,b=[],last=0,next=0,idx=0;
var N=13,S=256,R=124,TAU=Math.PI*2;
function surface(){var a=document.createElement('canvas');a.width=a.height=S;return a;}
function paint(o,t,target){var p=target.getContext('2d');p.clearRect(0,0,S,S);p.save();p.translate(S/2,S/2);p.beginPath();p.arc(0,0,R,0,TAU);p.clip();var q=p.createRadialGradient(-R*.2,-R*.25,R*.05,0,0,R);q.addColorStop(0,'rgba(15,24,40,.015)');q.addColorStop(.72,'rgba(30,45,65,.035)');q.addColorStop(1,'rgba(145,185,230,.22)');p.fillStyle=q;p.fillRect(-R,-R,R*2,R*2);for(var j=0;j<60;j++){var a=j*TAU/60,phase=3*Math.sin(a*2+t*.24+o.p)+2*Math.cos(a*3-t*.17),hu=(o.hue+phase*45+t*5+720)%360;for(var k=0;k<3;k++){p.beginPath();p.arc(0,0,R*(.985-k*.038),a,a+TAU/60+.008);p.strokeStyle='hsla('+hu+',85%,'+(65+k*5)+'%,'+((.12+.25*Math.pow(Math.abs(Math.cos(a-.9)),5))*(1-k*.25))+')';p.lineWidth=R*.038;p.stroke();}}p.translate(-R*.38,-R*.57);p.rotate(-.55);p.scale(1,.1875);p.beginPath();p.arc(0,0,R*.24,0,TAU);p.fillStyle='rgba(225,240,255,.22)';p.fill();p.restore();}
function spawn(initial,t){var o={x:Math.random()*w,y:initial?Math.random()*h:h+20,r:(.035+Math.pow(Math.random(),2)*.15)*Math.min(w,h),v:8+Math.random()*17,vx:0,vy:-12,life:12+Math.random()*65,age:initial?Math.random()*10:0,p:Math.random()*TAU,hue:Math.random()*360,a:surface(),z:surface(),changed:t};paint(o,t,o.a);return o;}
function resize(){var scale=Math.min(1,1280/Math.max(innerWidth,innerHeight));w=innerWidth;h=innerHeight;c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));g.setTransform(c.width/w,0,0,c.height/h,0,0);b=[];drops=[];for(var i=0;i<N;i++)b.push(spawn(true,last/1000));next=0;idx=0;}
var drops=[];
function burst(o){for(var j=0;j<7;j++){var a=j*TAU/7+Math.random()*.4;drops.push({x:o.x+Math.cos(a)*o.r*.9,y:o.y+Math.sin(a)*o.r*.9,vx:o.vx+Math.cos(a)*o.r*.55,vy:o.vy+Math.sin(a)*o.r*.55,age:0,life:.25+Math.random()*.35,r:Math.max(.6,o.r*.013),hue:o.hue});}}
function draw(ms){var t=ms/1000,dt=last?Math.min(.15,(ms-last)/1000):0;last=ms;if(t>=next){var o=b[idx];var tmp=o.z;o.z=o.a;o.a=tmp;paint(o,t,o.a);o.changed=t;o.blend=true;idx=(idx+1)%N;next=t+.18;}g.fillStyle='#020307';g.fillRect(0,0,w,h);for(var i=0;i<N;i++){var o=b[i],r=o.r;o.age+=dt;var X=o.x/w,Y=o.y/h;var u=24*Math.sin(Y*7+t*.12)+13*Math.cos(X*5-Y*3-t*.09);var v=-o.v+22*Math.cos(X*7+t*.1)+9*Math.sin(Y*6+X*3-t*.13);var ease=1-Math.exp(-dt*1.4);o.vx+=(u-o.vx)*ease;o.vy+=(v-o.vy)*ease;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.age>=o.life){if(o.y+r>0&&o.y-r<h&&o.x+r>0&&o.x-r<w)burst(o);b[i]=spawn(false,t);continue;}if(o.y+r<0||o.x+r<0||o.x-r>w||o.y-r>h+220){b[i]=spawn(false,t);continue;}var x=o.x,y=o.y,d=r*S/R;var f=o.blend?Math.min(1,(t-o.changed)/1.5):1;if(f<1){g.globalAlpha=1-f;g.drawImage(o.z,x-d/2,y-d/2,d,d);}g.globalAlpha=f;g.drawImage(o.a,x-d/2,y-d/2,d,d);g.globalAlpha=1;}for(var j=drops.length-1;j>=0;j--){var a=drops[j];a.age+=dt;if(a.age>=a.life){drops.splice(j,1);continue;}a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=18*dt;g.globalAlpha=.55*(1-a.age/a.life);g.fillStyle='hsl('+a.hue+',65%,80%)';g.beginPath();g.arc(a.x,a.y,a.r,0,TAU);g.fill();}g.globalAlpha=1;requestAnimationFrame(draw);}
resize();window.addEventListener('resize',resize);requestAnimationFrame(draw);
})();
</script></body></html>
