(function(){var c=document.getElementById('c'),g=c.getContext('2d'),w,h,x=.5,y=.65,tx=.5,ty=.65,state='rest',until=0,last=0,face=1,walk=0,tailPose=null,nextFlick=0,flickStart=-100;var chars='.:;*+o01x/\\';var atlas=document.createElement('canvas'),a=atlas.getContext('2d');atlas.width=240;atlas.height=432;a.font='16px monospace';a.textAlign='center';a.textBaseline='middle';for(var j=0;j<9;j++)for(var i=0;i<chars.length;i++){a.fillStyle='hsl('+(185-j*2)+',23%,'+(12+j*9)+'%)';a.fillText(chars[i],i*20+10,j*24+12)}for(var j=0;j<9;j++)for(var i=0;i<chars.length;i++){a.fillStyle='hsl(158,42%,'+(18+j*8)+'%)';a.fillText(chars[i],i*20+10,(j+9)*24+12)}function resize(){var s=Math.min(1,1280/Math.max(innerWidth,innerHeight));w=c.width=Math.round(innerWidth*s);h=c.height=Math.round(innerHeight*s)}resize();addEventListener('resize',resize);function ell(x,y,cx,cy,rx,ry){return Math.pow((x-cx)/rx,2)+Math.pow((y-cy)/ry,2)<1}function surface(x,y,cx,cy,rx,ry){var u=(x-cx)/rx,v=(y-cy)/ry,r=u*u+v*v;if(r>=1)return null;var z=Math.sqrt(1-r);return {z:z,light:Math.max(0,(-.42*u-.57*v+.70*z))}}var mx=.72,my=.28,mvx=0,mvy=0,mtx=.72,mty=.28,mnext=0,mrest=false,notice=false,interest=0,cool=0,actStart=0,actEnd=0,launchX=0,launchY=0,landX=0,landY=0; function action(q,t,d){state=q;actStart=t;actEnd=until=t+d;launchX=x;launchY=y;landX=Math.max(.22,Math.min(.78,mx));landY=Math.max(.23,Math.min(.77,my+.10));}

function choose(t){var r=Math.random();if(r<.20){action('groom',t,12+Math.random()*7);return}if(r<.34){action('stretch',t,3.2);return}state=r<.48?'walk':r<.72?'rest':'sleep';until=t+(state==='sleep'?15:state==='rest'?5:7)+Math.random()*8;tx=.25+Math.random()*.5;ty=.27+Math.random()*.46}function draw(ms){requestAnimationFrame(draw);if(ms-last<32)return;var dt=Math.min(.08,(ms-last)/1000||.033);last=ms;var t=ms/1000;if(t>until)choose(t);moth(t,dt);var dist=Math.hypot(mx-x,my-y);if(state==='hunt'&&dist<.25&&Math.random()<dt*1.1){action(dist<.12?'bat':'pounce',t,dist<.12?.85:1.45);face=mx<x?-1:1;}var phase=Math.max(0,Math.min(1,(t-actStart)/(actEnd-actStart||1))),pose=Math.sin(Math.PI*phase),jump=0;if(state==='pounce'){var flight=Math.max(0,Math.min(1,(phase-.28)/.55));x=launchX+(landX-launchX)*flight;y=launchY+(landY-launchY)*flight;jump=Math.sin(Math.PI*flight)*13;}var moving=state==='walk'||state==='hunt';if(moving){var dx=tx-x,dy=ty-y,d=Math.sqrt(dx*dx+dy*dy);if(d>.012){face=dx<0?-1:1;var v=Math.min(d,dt*(state==='hunt'?.12:.075));x+=dx/d*v;y+=dy/d*v;walk+=dt*(state==='hunt'?13:11)}else{state='rest';until=t+3}}g.fillStyle='#050709';g.fillRect(0,0,w,h);var s=Math.max(2,Math.min(w,h)/140),sleep=state==='sleep',b=Math.sin(t*1.7)*.4,blink=sleep||t%6.7>6.45;g.save();g.translate(x*w,y*h-jump*s);g.scale(face,1);var stretch=state==='stretch'?pose:0,crouch=state==='pounce'&&phase<.28?Math.sin(phase/.28*Math.PI/2):0,reach=state==='pounce'?Math.sin(Math.PI*Math.max(0,Math.min(1,(phase-.28)/.55))):0,bat=state==='bat'?Math.pow(pose,2):0;var grooming=state==='groom',pause=grooming&&notice&&Math.sin(t*.8)>.55,cycle=(t-actStart)%3.4, wash=grooming?Math.min(1,Math.max(0,Math.min(phase*12,(1-phase)*12))):0, sweep=pause?.65:cycle<1.2?.65+.06*Math.sin(t*17):cycle<2.7?.65+.35*Math.sin((cycle-1.2)/1.5*Math.PI):.65*(1-(cycle-2.7)/.7), flank=grooming&&phase>.65&&!pause;var bx=-3,by=sleep?6:3+3*crouch-2*stretch,br=13+4*stretch+4*reach-2*crouch,bh=sleep?6+b:9+b-3*stretch-3*crouch-2*reach,hx=10+6*stretch+4*reach,hy=sleep?4:-6+9*stretch+5*crouch+2*reach+(moving?Math.sin(walk*2)*.6:0);if(grooming){by+=2*wash;bh+=2*wash;br-=2*wash;hx-=flank?10*wash:0;hy+=wash*(flank?8:2+1.2*Math.sin(t*8)*(cycle<1.2&&!pause?1:0));}var tail=[];var alert=state==='hunt'||state==='bat'||state==='pounce'||notice;if(t>nextFlick){nextFlick=t+3+Math.random()*8;if(alert)flickStart=t}var f=t-flickStart;var flick=alert&&f<.65?Math.sin(f/.65*Math.PI*2)*Math.sin(f/.65*Math.PI)*3:0;var target=(sleep||grooming)?[[-14,7],[-25,12],[-8,16],[9,12]]:(state==='hunt'||state==='pounce'||state==='bat')?[[-14,3],[-23,5],[-29,1],[-30,-3]]:state==='walk'?[[-14,3],[-22,-4],[-24,-15],[-19,-18]]:[[-14,3],[-23,-5],[-23,-19],[-16,-19]];if(!tailPose)tailPose=target.map(function(q){return q.slice()});for(var k=0;k<4;k++)for(var axis=0;axis<2;axis++)tailPose[k][axis]+=(target[k][axis]-tailPose[k][axis])*(1-Math.exp(-dt*3));for(var k=0;k<=24;k++){var p=k/24,u=1-p;var q=tailPose;tail.push([u*u*u*q[0][0]+3*u*u*p*q[1][0]+3*u*p*p*q[2][0]+p*p*p*q[3][0]+flick*p*p*p,u*u*u*q[0][1]+3*u*u*p*q[1][1]+3*u*p*p*q[2][1]+p*p*p*q[3][1]+(moving&&state==='walk'?Math.sin(walk)*.65*p*p:0)])}for(var yy=-24;yy<=24;yy++)for(var xx=-34;xx<=38;xx++){var body=ell(xx,yy,bx,by,br,bh),head=ell(xx,yy,hx,hy,9,8),ey=yy-hy-6,ex=xx-hx,ear=!sleep&&ey>=-20&&ey<=-10&&(Math.abs(ex+6-(ey+20)*.16)<(ey+20)*.42+.5||Math.abs(ex-6+(ey+20)*.16)<(ey+20)*.42+.5),leg=false;if(!sleep)for(var l=0;l<4;l++){var front=l>=2,side=l%2,ang=moving?Math.sin(walk+((front?1:0)^side)*Math.PI):0;var root=front?6:-11,footX=root+ang*5+(front?stretch*13+reach*10+(side===0?bat*16:0):-reach*8),footY=15-Math.max(0,ang)*3-(front&&side===0?bat*12:0)-reach*5;if(grooming&&front&&side===0){footX+=(hx+2-footX)*wash*sweep;footY+=(hy+5-9*Math.max(0,(sweep-.65)/.35)-footY)*wash*sweep;}var rootY=by+3;var vx=footX-root,vy=footY-rootY,frac=Math.max(0,Math.min(1,((xx-root)*vx+(yy-rootY)*vy)/(vx*vx+vy*vy||1)));leg=leg||Math.hypot(xx-root-frac*vx,yy-rootY-frac*vy)<(2.5-frac*.8)||ell(xx,yy,foot px monospace';g.fillText('z',x*w+20*s,y*h-10*s-Math.sin(t)*s*2)}}requestAnimationFrame(draw)})();
