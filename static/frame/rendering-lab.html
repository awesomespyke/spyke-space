<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Frame GPU Laboratory</title><style>body{margin:0;background:#080d16;color:#fff;font:24px monospace}canvas{position:absolute;width:100%;height:100%;inset:0}#info{position:absolute;top:4%;left:4%;right:4%;white-space:pre-wrap;background:#080d16df;padding:18px} </style><canvas id=c></canvas><canvas id=g></canvas><div id=info></div><script>
const c=document.querySelector('#c'),g=document.querySelector('#g'),info=document.querySelector('#info'),ctx=c.getContext('2d'),gl=g.getContext('webgl2',{antialias:false});const W=innerWidth,H=innerHeight;let results=[],i=0,start=0,last=0,frames=[],program,loc={},renderer='Unavailable';
const stages=[['Empty animation loop',0,1],['Cached Canvas sprites',1,1],['WebGL geometry',2,1],['WebGL luminous field',3,1],['WebGL luminous field 2x',3,2]];
const sprite=document.createElement('canvas');sprite.width=sprite.height=96;const s=sprite.getContext('2d'),grad=s.createRadialGradient(48,48,0,48,48,48);grad.addColorStop(0,'#fff');grad.addColorStop(.15,'#8ff');grad.addColorStop(1,'#00aaff00');s.fillStyle=grad;s.fillRect(0,0,96,96);
function shader(type,src){let a=gl.createShader(type);gl.shaderSource(a,src);gl.compileShader(a);if(!gl.getShaderParameter(a,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(a));return a}
let gpuError='';try{if(gl){let ext=gl.getExtension('WEBGL_debug_renderer_info');renderer=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
uniform float t;uniform float scale;out float hue;void main(){float id=float(gl_VertexID);float a=id*2.399963;float r=sqrt((id+.5)/600.);vec2 p=vec2(cos(a+t*.3),sin(a+t*.3))*r*.75;p.x+=.12*sin(t+p.y*5.);gl_Position=vec4(p,0,1);gl_PointSize=scale*(12.+8.*sin(id));hue=fract(id*.017);}`));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision mediump float;in float hue;uniform int mode;out vec4 color;void main(){float d=length(gl_PointCoord-.5)*2.;float a=mode==2?step(d,.7):exp(-d*d*5.)*smoothstep(1.,.7,d);color=vec4(mix(vec3(.15,.7,1.),vec3(1.,.55,.2),hue)*a,a);}`.replace('smoothstep(1.,.7,d)','(1.-smoothstep(.7,1.,d))')));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);for(let k of ['t','scale','mode'])loc[k]=gl.getUniformLocation(program,k);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);}}catch(e){gpuError=String(e);program=null}
function begin(){if(i>=stages.length){c.style.display=g.style.display='none';info.textContent='FRAME — GPU RESULTS\n'+W+' × '+H+' | DPR '+devicePixelRatio+'\nRenderer: '+renderer+'\n'+gpuError+'\n\n'+results.join('\n')+'\n\nPhotograph this screen. Reload to repeat.\nFPS = animation callbacks, not panel refresh.';return}let [name,mode,scale]=stages[i];if(mode>=2&&!program){results.push(name+': unavailable');i++;begin();return}c.style.display=mode<2?'block':'none';g.style.display=mode>=2?'block':'none';c.width=W;c.height=H;if(mode>=2){g.width=W*scale;g.height=H*scale;gl.viewport(0,0,g.width,g.height)}frames=[];start=last=0;info.textContent=name+' — 12 seconds\n'+W*scale+' × '+H*scale+' | 600 sprites/points in drawing tests';requestAnimationFrame(loop)}
function loop(now){if(!start){start=last=now}let elapsed=now-start;if(elapsed>2000)frames.push(now-last);last=now;let [name,mode,scale]=stages[i],t=elapsed/1000;if(mode===1){ctx.fillStyle='#080d16';ctx.fillRect(0,0,W,H);for(let j=0;j<600;j++){let a=j*2.399963+t*.3,r=Math.sqrt((j+.5)/600)*.37;ctx.drawImage(sprite,W*(.5+Math.cos(a)*r)-16,H*(.5+Math.sin(a)*r)-16,32,32)}}else if(mode>=2){gl.clearColor(.015,.025,.045,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(loc.t,t);gl.uniform1f(loc.scale,scale);gl.uniform1i(loc.mode,mode);gl.drawArrays(gl.POINTS,0,600)}if(elapsed>=12000){let sorted=frames.slice().sort((a,b)=>a-b),avg=frames.reduce((a,b)=>a+b,0)/frames.length;results.push(name+': '+(1000/avg).toFixed(1)+' fps | p95 '+(sorted[Math.floor(sorted.length*.95)]||0).toFixed(1)+' ms');i++;begin()}else requestAnimationFrame(loop)}begin();</script></html>
