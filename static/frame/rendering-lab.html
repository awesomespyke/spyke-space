<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Frame Rendering Laboratory</title><style>html,body{margin:0;background:#080d14;color:#eee;font:20px Arial;overflow:hidden}canvas{position:absolute;width:100%;height:100%}#info{position:absolute;top:4%;left:4%;right:4%;white-space:pre-wrap;background:#080d14dd;padding:18px;line-height:1.45}#foot{position:absolute;bottom:3%;left:4%;color:#aab9ca}</style></head><body><canvas id=c></canvas><div id=info></div><div id=foot></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),info=document.getElementById('info'),foot=document.getElementById('foot');let W=innerWidth,H=innerHeight,d=devicePixelRatio||1;let gl2=false,gl1=false;try{gl2=!!document.createElement('canvas').getContext('webgl2');gl1=!!document.createElement('canvas').getContext('webgl')}catch(e){}const results=[];let stage=0,start=performance.now(),last=start,times=[];const scales=[1,1.5,2];const names=['Static resolution chart','Canvas 1×','Canvas 1.5×','Canvas 2×','Results'];const durations=[20000,15000,15000,15000];function setup(){let s=stage===0?Math.min(d,2):scales[stage-1]||1;c.width=Math.round(W*s);c.height=Math.round(H*s);times=[];last=performance.now();}setup();function base(){return `Viewport: ${W} × ${H} CSS px   |   DPR: ${d}\nScreen: ${screen.width} × ${screen.height} CSS px   |   WebGL: ${gl1}   WebGL2: ${gl2}`;}function draw(t){let w=c.width,h=c.height;ctx.fillStyle='#080d14';ctx.fillRect(0,0,w,h);if(stage===0){for(let j=0;j<4;j++){let step=j+1,x=Math.round(w*(.06+j*.23)),y=Math.round(h*.35),bw=Math.round(w*.18),bh=Math.round(h*.23);ctx.fillStyle='white';for(let k=0;k<bw;k+=step*2)ctx.fillRect(x+k,y,step,bh);ctx.font=`${Math.round(h*.023)}px Arial`;ctx.fillText(`${step} backing-pixel stripes`,x,y+bh+h*.04);}for(let j=0;j<5;j++){ctx.font=`${Math.round((10+j*4)*w/W)}px monospace`;ctx.fillStyle='#fff2b4';ctx.fillText('Neko · Veiltail  +  *  :  o  /  \\  '+(10+j*4)+' CSS px',w*.07,h*(.72+j*.045));}return;}let s=w/W;ctx.save();ctx.scale(s,s);let x=W*(.5+.23*Math.sin(t*.0005)),y=H*(.53+.13*Math.cos(t*.0007));let g=ctx.createRadialGradient(x,y,0,x,y,H*.22);g.addColorStop(0,'#b96e2638');g.addColorStop(1,'#b96e2600');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.font='12px monospace';ctx.textAlign='center';for(let i=0;i<2400;i++){let a=i*2.399963,r=Math.sqrt(i/2400),px=x+Math.cos(a)*r*W*.13,py=y+Math.sin(a)*r*H*.17+Math.sin(a*2+t*.003)*8;ctx.fillStyle=i%3===0?'#fff4c2':'#e6a54b';ctx.fillText('·+o*:'[i%5],px,py);}ctx.strokeStyle='#bdf5ff';for(let i=0;i<45;i++){let bx=(i*137.3)%W,by=H-((i*73+t*.035)%H);ctx.beginPath();ctx.arc(bx,by,3+i%8,0,Math.PI*2);ctx.stroke();}ctx.restore();}function tick(t){if(stage===4)return;let elapsed=t-start;if(elapsed>=durations[stage]){if(stage>0){let a=times.slice().sort((a,b)=>a-b);results.push(`${names[stage]}: ${c.width} × ${c.height} | ${(1000/(a.reduce((x,y)=>x+y,0)/a.length)).toFixed(1)} fps | p95 ${(a[Math.floor(a.length*.95)]||0).toFixed(1)} ms`);}stage++;start=t;if(stage===4){ctx.fillStyle='#080d14';ctx.fillRect(0,0,c.width,c.height);info.textContent='FRAME — RESULTS\n'+base()+'\n\n'+results.join('\n')+'\n\nPhotograph this screen. Reload to repeat.\n'+navigator.userAgent;foot.textContent='FPS measures browser animation callbacks, not physical panel refresh.';return;}setup();elapsed=0;}if(stage>0&&elapsed>2000)times.push(t-last);last=t;draw(t);info.textContent=names[stage]+'\n'+base()+`\nCanvas backing: ${c.width} × ${c.height}`;foot.textContent=(stage===0?'Photograph stripe and text clarity now.  ':'Watch movement for stutter.  ')+Math.ceil((durations[stage]-elapsed)/1000)+' seconds remaining';requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
