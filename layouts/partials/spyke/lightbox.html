<div class="spyke-lightbox" id="spyke-lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
  <div class="spyke-lightbox__backdrop" data-gallery-close></div>
  <div class="spyke-lightbox__content">
    <div class="spyke-lightbox__top"><span id="spyke-lightbox-count" aria-live="polite"></span><button type="button" class="spyke-lightbox__control" id="spyke-lightbox-close" aria-label="Close photograph viewer">×</button></div>
    <div class="spyke-lightbox__stage"><button type="button" class="spyke-lightbox__control spyke-lightbox__arrow" id="spyke-lightbox-prev" aria-label="Previous photograph">‹</button><img id="spyke-lightbox-image" alt=""><button type="button" class="spyke-lightbox__control spyke-lightbox__arrow" id="spyke-lightbox-next" aria-label="Next photograph">›</button></div>
    <div class="spyke-lightbox__bottom"><div class="spyke-lightbox__details"><time id="spyke-lightbox-date"></time><span id="spyke-lightbox-caption"></span></div><a id="spyke-lightbox-source" href="#">View original message ↗</a></div>
  </div>
</div>
