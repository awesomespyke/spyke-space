<div class="spyke-floating-nav">
      <button id="spyke-nav-toggle" class="spyke-floating-nav__toggle"
              type="button" aria-label="Open navigation"
              aria-expanded="false" aria-controls="spyke-nav-panel">
        <svg viewBox="0 0 24 24" width="22" height="22"
             fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <nav id="spyke-nav-panel" class="spyke-floating-nav__panel"
           aria-label="SpykeSpace destinations" hidden>
        <a href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}
           aria-label="Messages" title="Messages">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.2-.7L4 20l1.7-5.3a8 8 0 0 1-.7-3.2A7.5 7.5 0 0 1 12.5 4 7.5 7.5 0 0 1 20 11.5Z"/>
          </svg>
          <span class="spyke-floating-nav__label">Messages</span>
        </a>
        <a href="https://library.spyke.space/"
           aria-label="Library" title="Library">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5c3-1.5 5.5-1.5 8 0v14c-2.5-1.5-5-1.5-8 0Zm8 0c2.5-1.5 5-1.5 8 0v14c-3-1.5-5.5-1.5-8 0Z"/>
          </svg>
          <span class="spyke-floating-nav__label">Library</span>
        </a>
        <a href="{{ "gallery/" | relURL }}"{{ if eq .Section "gallery" }} aria-current="page"{{ end }}
           aria-label="Photos" title="Photos">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="8" cy="9" r="1.5"/>
            <path d="m4 17 5-5 4 4 3-3 5 5"/>
          </svg>
          <span class="spyke-floating-nav__label">Photos</span>
        </a>
      </nav>
    </div>
