<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    
body {
  position: absolute;
  {{ if eq .Params.orientation "portrait" }}
  width: 100vh;
  height: 100vw;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(90deg);
  {{ else }}
  width: 100%;
  height: 100%;
  {{ end }}
  display: flex;
  align-items: center;
  justify-content: center;
}

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <img src="{{ .Params.image }}" alt="">
</body>
</html>
