{{ define "main" }}
<article style="max-width:760px;margin:1.5rem auto;padding:1.5rem;border-radius:18px;background:var(--card-background,rgba(128,128,128,.07));overflow-wrap:anywhere">
  <p><a href="{{ "transmissions/" | relURL }}">← All transmissions</a></p>
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" style="display:block;opacity:.65;margin-bottom:1rem">{{ .Date.Format "Jan 2, 2006 · 3:04 PM MST" }}</time>
  <div class="transmission-body">{{ .Content }}</div>
</article>
<style>.transmission-body img,.transmission-body video,.transmission-body audio{max-width:100%;height:auto;border-radius:12px}</style>
{{ end }}
