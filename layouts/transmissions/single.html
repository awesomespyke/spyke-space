{{ define "main" }}
<link rel="stylesheet" href="{{ "css/spyke-transmissions.css" | relURL }}">
<main class="spyke-chat spyke-chat--single" aria-label="SpykeSpace transmission">
  <header class="spyke-chat__header"><a class="spyke-chat__back" href="{{ "transmissions/" | relURL }}">← Transmissions</a></header>
  <div class="spyke-chat__thread">
    <div class="spyke-chat__date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></div>
    <article class="spyke-chat__message"><div class="spyke-chat__bubble"><div class="spyke-chat__content">{{ .Content }}</div><footer class="spyke-chat__meta"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "3:04 PM" }} UTC</time></footer></div></article>
  </div>
</main>
{{ end }}
