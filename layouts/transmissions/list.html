{{ define "main" }}
<section class="transmission-stream" style="max-width:760px;margin:0 auto;padding:1.5rem 0 4rem">
  <header style="margin-bottom:2rem"><h1 style="font-size:2rem;margin:0 0 .35rem">Transmissions</h1><p style="opacity:.7;margin:0">Notes and moments, as they arrive.</p></header>
  {{ $pages := .Pages.ByDate.Reverse }}
  {{ range $pages }}
    <article style="margin:0 0 1.25rem;padding:1.4rem;border-radius:18px;background:var(--card-background,rgba(128,128,128,.07));overflow-wrap:anywhere">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" style="display:block;font-size:.8rem;opacity:.65;margin-bottom:.8rem">{{ .Date.Format "Jan 2, 2006 · 3:04 PM MST" }}</time>
      <div class="transmission-body">{{ .Content }}</div>
    </article>
  {{ else }}<p>No transmissions yet.</p>{{ end }}
</section>
<style>.transmission-body p{margin:.6em 0}.transmission-body img{max-width:100%;height:auto;border-radius:12px}.transmission-body video,.transmission-body audio{max-width:100%}.transmission-body p:has(img){margin:1rem 0}</style>
{{ end }}
